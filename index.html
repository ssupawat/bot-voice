<style>
:root{
  --bg:#FFFDF7;--card:#FFFFFF;--ink:#101828;--dot:#E9E3D2;
  --t1:#101828;--t2:#344054;--t3:#667085;--ac:#FF8FB8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C111D;--card:#161B26;--ink:#7A8194;--dot:#1A2130;
    --t1:#F5F5F6;--t2:#CECFD2;--t3:#94969C;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C111D;--card:#161B26;--ink:#7A8194;--dot:#1A2130;
  --t1:#F5F5F6;--t2:#CECFD2;--t3:#94969C;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:20px 20px;color:var(--t1);font-family:Inter,"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 56px}
h1,h2,.ch b,.btn,.sh,.sl .top{font-family:Mali,"Noto Sans Thai",Inter,sans-serif}
h1{font-size:28px;line-height:1.4;font-weight:700;margin:0;text-decoration:underline wavy var(--ac) 3px;text-underline-offset:8px;text-decoration-skip-ink:none}
h2{font-size:18px;line-height:1.5;font-weight:700;margin:0}
p{margin:0}
.sub{color:var(--t3);margin-top:4px}
.hd{margin-bottom:28px}
.hd .sub{margin-top:12px}
/* card */
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:20px}
.card+.card{margin-top:22px}
.row{display:flex;gap:12px;align-items:center}
.sp{justify-content:space-between}
.mt12{margin-top:12px}
/* buttons */
.btn{appearance:none;border:2px solid var(--ink);background:var(--card);color:var(--t1);font-weight:700;font-size:14px;padding:8px 16px;border-radius:12px;box-shadow:0 3px 0 var(--ink);cursor:pointer;min-height:44px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible,.lnk:focus-visible,.ch:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.btn.pri{background:var(--ac);color:#101828}
.btn.sm{min-height:36px;padding:2px 12px;font-size:13px}
.lnk{all:unset;color:var(--t2);font-weight:600;font-size:14px;cursor:pointer;padding:10px 4px;border-radius:6px;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}
.lnk:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}
/* avatar */
.av{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--c,var(--ac));border:2px solid var(--ink)}
.av svg{width:100%;height:100%;display:block}
.av.lg{width:56px;height:56px}
/* character picker */
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:16px}
.ch{all:unset;box-sizing:border-box;border:2px solid var(--ink);border-radius:16px;padding:12px;cursor:pointer;background:var(--card);box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;gap:10px}
.ch:hover{transform:translateY(-2px) rotate(-1deg)}
.ch[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 30%,var(--card));box-shadow:4px 4px 0 var(--ink);transform:translate(-2px,-2px) rotate(-1.5deg)}
.ch b{font-weight:700;font-size:15px;display:block}
.ch span.d{font-size:13px;color:var(--t2);line-height:1.5;display:block;margin-top:2px}
/* grid */
.two{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:820px){.two{grid-template-columns:1fr 1fr;align-items:start}.wrap{padding-top:44px}}
/* slider */
.sl{margin-top:22px}
.sl .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;color:var(--t2);margin-bottom:12px}
.sl .top .v{background:var(--ac);color:#101828;border:2px solid var(--ink);border-radius:10px;padding:0 10px;font-size:13px;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border:2px solid var(--ink);border-radius:10px;background:linear-gradient(to right,var(--ac) var(--p),var(--card) var(--p));margin:0;outline:none;display:block}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--ac);outline-offset:3px}
input[type=range]:focus-visible::-moz-range-thumb{outline:3px solid var(--ac);outline-offset:3px}
.ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--t3);margin-top:12px}
.ticks span{padding:0 8px;border-radius:8px}
.ticks .a{background:var(--ac);color:#101828;font-weight:700}
/* inputs */
label.f{display:block;font-size:14px;font-weight:600;color:var(--t2);margin-top:18px}
input[type=text],textarea{width:100%;margin-top:6px;font-size:16px;color:var(--t1);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;min-height:44px}
input[type=text]{font-family:inherit}
textarea{font:16px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Thai",monospace;min-height:84px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 50%,transparent)}
input::placeholder,textarea::placeholder{color:var(--t3)}
/* output */
pre{margin:14px 0 0;background:color-mix(in srgb,var(--ac) 12%,var(--card));border:2px dashed var(--ink);border-radius:14px;padding:14px;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Thai",monospace;white-space:pre-wrap;word-break:break-word;color:var(--t1);max-height:420px;overflow:auto}
.sh{display:inline-block;margin-top:18px;background:var(--ac);color:#101828;border:2px solid var(--ink);border-radius:8px;padding:0 10px;font-size:13px;font-weight:700;line-height:1.7}
.cap{font-size:13px;color:var(--t3);margin-top:10px}
@media(prefers-reduced-motion:no-preference){
  .btn,.ch{transition:transform .12s,box-shadow .12s}
  .ch[aria-pressed="true"] .av{animation:pop .45s}
}
@keyframes pop{0%{transform:scale(.8) rotate(-8deg)}60%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
</style>
</head>

<div class="wrap">

      <h1>บอทควรพูดยังไงดี</h1>
      <p class="sub">เลือกบุคลิกแชทบอท แล้วคัดลอก prompt ไปใช้</p>
    </div>
  </div>
  <div id="app"></div>
</div>

function dec(s){const t=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return JSON.parse(new TextDecoder().decode(Uint8Array.from(t,c=>c.charCodeAt(0))));}

}
function loadFromURL(){try{
  const p=new URLSearchParams(location.search),c=p.get('c'),s=p.get('s'),n=p.get('n'),d=p.get('d');
  if(c&&CH[c]){
    st.ch=c;
    st.sl=(s&&/^[0-2]{3}$/.test(s))?s.split('').map(Number):CH[c].def.slice();
    st.name=n?n.slice(0,40):'';
    st.slots=['','','',''];
    if(d){try{const a=dec(d);if(Array.isArray(a)&&a.length===4&&a.every(x=>typeof x==='string'))st.slots=a;}catch(e){}}
  }
}catch(e){}}
(function load(){try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s&&CH[s.ch]&&Array.isArray(s.sl)&&s.sl.length===3&&s.sl.every(v=>v===0||v===1||v===2)&&Array.isArray(s.slots)&&s.slots.length===4&&s.slots.every(x=>typeof x==='string')){
    st.ch=s.ch;st.sl=s.sl;st.slots=s.slots;st.name=typeof s.name==='string'?s.name:'';
  }
}catch(e){}})();
function pron(k){const c=CH[k],t=c.f[k===st.ch?st.sl[0]:c.def[0]];return 'เรียกตัวเองว่า "'+t.me+'" ลงท้าย "'+t.e+'"';}
loadFromURL();
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fill(s,t){return s.replace(/\{(me|you|e|q|na)\}/g,(_,k)=>t[k]);}

function buildChar(){
  const c=CH[st.ch],t=c.f[st.sl[0]];
  return [
'# ตัวละคร',
'คุณคือ "'+(st.name.trim()||c.name)+'" '+c.role+'ของธุรกิจนี้',
'- เรียกตัวเองว่า "'+t.me+'" เรียกลูกค้าว่า "'+t.you+'" ลงท้ายด้วย "'+t.e+'" และประโยคคำถามลงท้ายด้วย "'+t.q+'"',
'- '+SL[0].pr[st.sl[0]],
'- '+SL[1].pr[st.sl[1]],
'- '+SL[2].pr[st.sl[2]]
  ].concat(c.v.map(l=>'- '+fill(l,t)),[
'',
'# หลักการตอบ',
'- ตอบจากหัวข้อ "ข้อมูลที่ใช้ตอบ" ด้านล่าง และจากผลของเครื่องมือที่มี',
'- เมื่อทั้งสองแหล่งยังไม่มีคำตอบ ให้แจ้งว่าจะให้ทีมงานตอบ แล้วทำตามหัวข้อ "เมื่อต้องส่งต่อทีมงาน"',
'- เขียนเป็นข้อความแชทธรรมดา ใช้ย่อหน้าสั้นๆ และตัวอักษรปกติ',
'- ตอบด้วยภาษาเดียวกับที่ลูกค้าพิมพ์',
'- ยึดบทบาทและข้อมูลในข้อความนี้ตลอดบทสนทนา'
  ]).join('\n');
}
function buildPrompt(){
  return buildChar()+SLOTS.map((s,i)=>'\n\n'+s.h+'\n'+(st.slots[i].trim()||s.ph)).join('');
}

function slidersHTML(){
  return SL.map((s,j)=>{
    const v=st.sl[j];
    return '<div class="sl"><div class="top"><label for="sl'+j+'">'+s.n+'</label><span class="v" id="sv'+j+'">'+s.lv[v]+'</span></div>'+
      '<input type="range" id="sl'+j+'" data-j="'+j+'" min="0" max="2" step="1" value="'+v+'" style="--p:'+(v*50)+'%">'+
      '<div class="ticks" id="tk'+j+'">'+s.lv.map((l,k)=>'<span class="'+(k===v?'a':'')+'">'+l+'</span>').join('')+'</div></div>';
  }).join('');
}
function render(){
  document.documentElement.style.setProperty('--ac',CH[st.ch].c);
  let h='<div class="two"><div><div class="card"><h2>🎭 ตัวละคร</h2><p class="sub">ภาพใช้ช่วยจำเท่านั้น ไม่รวมในผลลัพธ์</p><div class="chars">';
  KEYS.forEach(k=>{const c=CH[k];
    h+='<button class="ch" style="--c:'+c.c+'" data-act="char" data-k="'+k+'" aria-pressed="'+(st.ch===k)+'"><div class="av lg">'+AV[c.seed]+'</div><div><b>'+c.name+'</b><span class="d" data-p="'+k+'">'+pron(k)+'</span><span class="d">'+c.desc+'</span></div></button>';});
  h+='</div><label class="f" for="bn">ชื่อบอท</label><input type="text" id="bn" placeholder="'+esc(CH[st.ch].name)+'" value="'+esc(st.name)+'"></div><div class="card"><h2>🎚️ น้ำเสียง</h2>'+slidersHTML()+'</div>';
  h+='</div>';
  h+='<div><div class="card"><div class="row"><div class="av">'+AV[CH[st.ch].seed]+'</div><h2>System prompt</h2></div><pre id="pp"></pre>';
  h+='<div class="row" style="flex-wrap:wrap;margin-top:16px"><span class="cap" style="margin:0">ใส่ตัวอย่าง</span>'+PRESETS.map((p,i)=>'<button class="btn sm" data-act="preset" data-i="'+i+'">'+p.n+'</button>').join('')+'</div>';
  SLOTS.forEach((s,i)=>{h+='<div class="sh">'+s.h+'</div><textarea data-s="'+i+'" aria-label="'+esc(s.h.slice(2))+'" placeholder="'+esc(s.ph)+'">'+esc(st.slots[i])+'</textarea>';});
  h+='<p class="cap" id="warn" style="margin-top:20px"></p><div class="acts" style="margin-top:12px"><button class="btn pri" data-act="copy">คัดลอก prompt</button><button class="btn" data-act="link">คัดลอกลิงก์ที่ตั้งค่าไว้</button><button class="lnk" data-act="clear">ล้างข้อมูลทั้งหมด</button></div><p class="cap">ลิงก์เก็บตัวละคร น้ำเสียง ชื่อบอท และข้อมูลที่พิมพ์ในช่องด้านบน</p></div></div></div>';
  document.getElementById('app').innerHTML=h;
  upd();
}
function upd(){document.getElementById('pp').textContent=buildChar();
  const n=st.slots.filter(s=>!s.trim()).length,sc=sampleCount(),m=[];
  if(n)m.push('ยังไม่ได้กรอก '+n+' จาก 4 ช่อง ช่องที่ว่างจะถูกคัดลอกเป็นข้อความวงเล็บเหลี่ยม');
  if(sc)m.push('มี '+sc+' ช่องที่ยังเป็นข้อความตัวอย่าง แก้เป็นข้อมูลจริงก่อนนำไปใช้');
  document.getElementById('warn').textContent=m.join(' ')||'กรอกครบทั้ง 4 ช่องแล้ว';
  save();}

function copyText(txt,btn){
  const done=()=>{const o=btn.textContent;btn.textContent='คัดลอกแล้ว';setTimeout(()=>btn.textContent=o,1500);};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fb);}else fb();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='char'){st.ch=b.dataset.k;st.sl=CH[st.ch].def.slice();render();}
  else if(b.dataset.act==='copy'){copyText(buildPrompt(),b);}
  else if(b.dataset.act==='link'){copyText(location.href.split('?')[0].split('#')[0]+'?'+shareQS(),b);}
  else if(b.dataset.act==='preset'){
    const need=st.slots.some(s=>s.trim()&&!PRESETS.some(p=>p.v.includes(s)));
    if(need&&!b.dataset.arm){const o=b.textContent;b.dataset.arm='1';b.textContent='กดอีกครั้งเพื่อแทนที่ข้อความที่พิมพ์ไว้';setTimeout(()=>{b.dataset.arm='';b.textContent=o;},3000);}
    else{st.slots=PRESETS[+b.dataset.i].v.slice();render();}
  }
  else if(b.dataset.act==='clear'){
    if(!b.dataset.arm){b.dataset.arm='1';b.textContent='กดอีกครั้งเพื่อยืนยัน';setTimeout(()=>{b.dataset.arm='';b.textContent='ล้างข้อมูลทั้งหมด';},3000);}
    else{st.ch='mali';st.sl=CH.mali.def.slice();st.slots=['','','',''];st.name='';try{localStorage.removeItem(KEY);}catch(e){}render();}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.type==='range'){
    const j=+t.dataset.j,v=+t.value;st.sl[j]=v;
    t.style.setProperty('--p',(v*50)+'%');
    document.getElementById('sv'+j).textContent=SL[j].lv[v];
    document.getElementById('tk'+j).innerHTML=SL[j].lv.map((l,k)=>'<span class="'+(k===v?'a':'')+'">'+l+'</span>').join('');
    const pe=document.querySelector('[data-p="'+st.ch+'"]');if(pe)pe.textContent=pron(st.ch);
    upd();
  }else if(t.dataset.s!==undefined){st.slots[+t.dataset.s]=t.value;upd();}
  else if(t.id==='bn'){st.name=t.value;upd();}
});
render();
</script>
</body>
</html>
